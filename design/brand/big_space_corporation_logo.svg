<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <title>Big Space Corporation — Making Space A Smaller Place</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Dots&amp;display=block');
    .ring-text { font-family: 'Zen Dots', 'Arial Black', sans-serif; font-size: 50px; letter-spacing: 2px; fill: #F3E6C4; }
    .tagline { font-family: 'Zen Dots', 'Arial Black', sans-serif; font-size: 46px; fill: #F3E6C4; stroke: #14213D; stroke-width: 10px; paint-order: stroke; stroke-linejoin: round; }
    .outline { stroke: #14213D; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
  </style>
  <defs>
    <path id="top-arc" d="M 98 500 A 402 402 0 0 1 902 500"/>
    <clipPath id="disc"><circle cx="500" cy="500" r="352"/></clipPath>
    <clipPath id="planet"><circle cx="300" cy="330" r="78"/></clipPath>
    <clipPath id="ring-front"><rect x="160" y="330" width="290" height="120"/></clipPath>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2E6FC2"/>
      <stop offset="1" stop-color="#173F7A"/>
    </radialGradient>
  </defs>

  <!-- Seal: cream rim, navy lettering band, blue field -->
  <circle cx="500" cy="500" r="492" fill="#F3E6C4"/>
  <circle cx="500" cy="500" r="476" fill="#14213D"/>
  <circle cx="500" cy="500" r="362" fill="#F3E6C4"/>
  <circle cx="500" cy="500" r="352" fill="url(#glow)"/>

  <text class="ring-text"><textPath href="#top-arc" startOffset="50%" text-anchor="middle">BIG SPACE CORPORATION</textPath></text>

  <!-- Sparkles along the bottom of the band -->
  <g fill="#F2B33D">
    <path d="M 500 900 l 7 -30 l 7 30 l 30 7 l -30 7 l -7 30 l -7 -30 l -30 -7 z" transform="translate(-7 -7)"/>
    <path d="M 0 0 l 5 -20 l 5 20 l 20 5 l -20 5 l -5 20 l -5 -20 l -20 -5 z" transform="translate(348 870)"/>
    <path d="M 0 0 l 5 -20 l 5 20 l 20 5 l -20 5 l -5 20 l -5 -20 l -20 -5 z" transform="translate(642 870)"/>
  </g>

  <!-- Starfield -->
  <g clip-path="url(#disc)" fill="#F3E6C4">
    <circle cx="420" cy="215" r="4"/><circle cx="520" cy="190" r="3"/><circle cx="205" cy="460" r="3"/>
    <circle cx="800" cy="440" r="4"/><circle cx="455" cy="300" r="3"/><circle cx="790" cy="610" r="3"/>
    <circle cx="230" cy="620" r="4"/><circle cx="380" cy="400" r="3"/><circle cx="560" cy="250" r="3"/>
    <circle cx="690" cy="760" r="3"/><circle cx="300" cy="760" r="3"/>
    <path fill="#F2B33D" d="M 470 250 l 7 -30 l 7 30 l 30 7 l -30 7 l -7 30 l -7 -30 l -30 -7 z"/>
    <path d="M 760 470 l 5 -20 l 5 20 l 20 5 l -20 5 l -5 20 l -5 -20 l -20 -5 z"/>
    <path fill="#F2B33D" d="M 215 520 l 4 -16 l 4 16 l 16 4 l -16 4 l -4 16 l -4 -16 l -16 -4 z"/>
  </g>

  <!-- Ringed planet, upper left -->
  <g transform="rotate(-18 300 330)">
    <ellipse cx="300" cy="330" rx="135" ry="30" fill="none" stroke="#F2B33D" stroke-width="12"/>
  </g>
  <circle cx="300" cy="330" r="78" fill="#E8742A"/>
  <g clip-path="url(#planet)" fill="#C85A1E">
    <rect x="200" y="280" width="200" height="16" transform="rotate(-18 300 330)"/>
    <rect x="200" y="315" width="200" height="10" transform="rotate(-18 300 330)"/>
    <rect x="200" y="360" width="200" height="22" transform="rotate(-18 300 330)"/>
    <circle cx="335" cy="375" r="48" fill="#B34E19" opacity="0.5"/>
  </g>
  <g transform="rotate(-18 300 330)" clip-path="url(#ring-front)">
    <ellipse cx="300" cy="330" rx="135" ry="30" fill="none" stroke="#F2B33D" stroke-width="12"/>
  </g>

  <!-- Waving astronaut, upper right, floating at a tilt -->
  <g transform="translate(615 350) rotate(14)">
    <rect x="-46" y="-12" width="92" height="74" rx="14" fill="#9AA0A8" class="outline"/>
    <path d="M -30 92 L -34 136 Q -34 146 -22 146 L -6 146 Q 2 146 2 138 L 0 92 Z" fill="#EDEFF2" class="outline"/>
    <path d="M 30 92 L 34 136 Q 34 146 22 146 L 6 146 Q -2 146 -2 138 L 0 92 Z" fill="#EDEFF2" class="outline"/>
    <rect x="-38" y="132" width="34" height="16" rx="6" fill="#C8352E" class="outline"/>
    <rect x="4" y="132" width="34" height="16" rx="6" fill="#C8352E" class="outline"/>
    <path d="M -38 -2 Q -76 30 -66 72" fill="none" stroke="#14213D" stroke-width="30" stroke-linecap="round"/>
    <path d="M -38 -2 Q -76 30 -66 72" fill="none" stroke="#EDEFF2" stroke-width="18" stroke-linecap="round"/>
    <circle cx="-66" cy="76" r="14" fill="#C8352E" class="outline"/>
    <path d="M 38 0 Q 74 -10 80 -62" fill="none" stroke="#14213D" stroke-width="30" stroke-linecap="round"/>
    <path d="M 38 0 Q 74 -10 80 -62" fill="none" stroke="#EDEFF2" stroke-width="18" stroke-linecap="round"/>
    <circle cx="81" cy="-70" r="15" fill="#C8352E" class="outline"/>
    <path d="M 102 -90 q 10 8 8 24 M 114 -102 q 14 13 12 34" fill="none" stroke="#F3E6C4" stroke-width="5" stroke-linecap="round"/>
    <rect x="-40" y="-4" width="80" height="102" rx="26" fill="#EDEFF2" class="outline"/>
    <rect x="-20" y="22" width="40" height="28" rx="5" fill="#2E6FC2" class="outline"/>
    <circle cx="-8" cy="36" r="5" fill="#F2B33D"/>
    <circle cx="8" cy="36" r="5" fill="#C8352E"/>
    <rect x="-40" y="66" width="80" height="10" fill="#F2B33D" class="outline"/>
    <circle cx="0" cy="-36" r="44" fill="#EDEFF2" class="outline"/>
    <ellipse cx="2" cy="-34" rx="30" ry="24" fill="#14213D"/>
    <path d="M -16 -44 Q -8 -54 6 -52" fill="none" stroke="#F3E6C4" stroke-width="6" stroke-linecap="round"/>
    <circle cx="16" cy="-24" r="4" fill="#F3E6C4"/>
  </g>

  <!-- Tagline across the middle -->
  <text class="tagline" x="500" y="528" text-anchor="middle">MAKING SPACE</text>
  <text class="tagline" x="500" y="590" text-anchor="middle">A SMALLER PLACE</text>

  <!-- Rocket ship flying up and to the right, with a dashed trail -->
  <g clip-path="url(#disc)">
    <path d="M 176 790 Q 250 744 318 756" fill="none" stroke="#F3E6C4" stroke-width="6" stroke-dasharray="16 12" stroke-linecap="round"/>
  </g>
  <g transform="translate(520 700) rotate(-16)">
    <path d="M -150 0 L -196 -18 L -184 0 L -196 18 Z" fill="#F2B33D"/>
    <path d="M -146 0 L -176 -10 L -170 0 L -176 10 Z" fill="#FFF3C9"/>
    <path d="M -110 -30 L -150 -64 Q -158 -70 -152 -58 L -132 -26 Z" fill="#C8352E" class="outline"/>
    <path d="M -110 30 L -150 64 Q -158 70 -152 58 L -132 26 Z" fill="#C8352E" class="outline"/>
    <path d="M -140 -30 L 60 -30 Q 140 -26 170 0 Q 140 26 60 30 L -140 30 Q -150 0 -140 -30 Z" fill="#D9DDE2" class="outline"/>
    <path d="M 118 -24 Q 152 -16 170 0 Q 152 16 118 24 Q 126 0 118 -24 Z" fill="#C8352E" class="outline"/>
    <path d="M -130 -8 L -40 -8" stroke="#C8352E" stroke-width="7" stroke-linecap="round"/>
    <circle cx="10" cy="0" r="15" fill="#2E6FC2" class="outline"/>
    <circle cx="60" cy="0" r="15" fill="#2E6FC2" class="outline"/>
    <path d="M 4 -6 Q 8 -10 14 -8 M 54 -6 Q 58 -10 64 -8" fill="none" stroke="#F3E6C4" stroke-width="3" stroke-linecap="round"/>
    <path d="M -96 0 L -60 0" stroke="#14213D" stroke-width="20" stroke-linecap="round"/>
    <path d="M -96 0 L -60 0" stroke="#C8352E" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
